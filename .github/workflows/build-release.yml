name: Build and Release Driver

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0-manual'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: my-viogpu

      - name: Setup Enterprise WDK (EWDK)
        shell: powershell
        run: |
          # The direct link to Windows 11 22H2 EWDK ISO (resolves the fwlink directly to avoid curl issues)
          $ewdkUrl = "https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66749/ewdk_wdk.iso"
          # Wait, Microsoft links expire or change. Using Invoke-WebRequest properly follows fwlinks in powershell.
          Write-Host "Downloading EWDK from official link..."
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2262222" -OutFile "$env:GITHUB_WORKSPACE\ewdk.iso"

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\ewdk.iso")) {
            throw "EWDK ISO download failed!"
          }

          $fileSize = (Get-Item "$env:GITHUB_WORKSPACE\ewdk.iso").length
          Write-Host "Downloaded EWDK ISO Size: $fileSize bytes"
          if ($fileSize -lt 100000000) { # If it's smaller than 100MB, it's not the ISO!
             throw "Downloaded file is too small to be an ISO! Likely a redirect page."
          }

          Write-Host "Mounting EWDK ISO..."
          $mountResult = Mount-DiskImage -ImagePath "$env:GITHUB_WORKSPACE\ewdk.iso" -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          Write-Host "Mounted EWDK on drive ${driveLetter}:"
          echo "EWDK_DRIVE=$driveLetter" >> $env:GITHUB_ENV

      - name: Clone kvm-guest-drivers-windows
        run: |
          git clone https://github.com/virtio-win/kvm-guest-drivers-windows.git

      - name: Replace viogpu directory
        run: |
          Remove-Item -Recurse -Force kvm-guest-drivers-windows\viogpu
          Copy-Item -Recurse -Force my-viogpu kvm-guest-drivers-windows\viogpu

      - name: Build VirtioLib (Win11 x64)
        run: |
          cd kvm-guest-drivers-windows\VirtIO
          cmd.exe /c "${{ env.EWDK_DRIVE }}:\LaunchBuildEnv.cmd && msbuild VirtioLib.vcxproj /p:Configuration=""Win11 Release"" /p:Platform=x64"

      - name: Build VirtIO-GPU Driver (Win11 x64)
        run: |
          cd kvm-guest-drivers-windows\viogpu
          cmd.exe /c "${{ env.EWDK_DRIVE }}:\LaunchBuildEnv.cmd && msbuild viogpu.sln /p:Configuration=""Win11 Release"" /p:Platform=x64"

      - name: Build VirtioLib (Win10 x64)
        run: |
          cd kvm-guest-drivers-windows\VirtIO
          cmd.exe /c "${{ env.EWDK_DRIVE }}:\LaunchBuildEnv.cmd && msbuild VirtioLib.vcxproj /p:Configuration=""Win10 Release"" /p:Platform=x64"

      - name: Build VirtIO-GPU Driver (Win10 x64)
        run: |
          cd kvm-guest-drivers-windows\viogpu
          cmd.exe /c "${{ env.EWDK_DRIVE }}:\LaunchBuildEnv.cmd && msbuild viogpu.sln /p:Configuration=""Win10 Release"" /p:Platform=x64"

      - name: Prepare Release Artifacts
        run: |
          mkdir release_artifacts

          # Win11
          if (Test-Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win11_amd64\amd64") {
            mkdir release_artifacts\win11
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win11_amd64\amd64\*" -Destination "release_artifacts\win11" -Recurse
          } elseif (Test-Path "kvm-guest-drivers-windows\viogpu\x64\Win11 Release") {
            mkdir release_artifacts\win11
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\x64\Win11 Release\*" -Destination "release_artifacts\win11" -Recurse
          }

          # Win10
          if (Test-Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win10_amd64\amd64") {
            mkdir release_artifacts\win10
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win10_amd64\amd64\*" -Destination "release_artifacts\win10" -Recurse
          } elseif (Test-Path "kvm-guest-drivers-windows\viogpu\x64\Win10 Release") {
            mkdir release_artifacts\win10
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\x64\Win10 Release\*" -Destination "release_artifacts\win10" -Recurse
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver-x64
          path: release_artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viogpu-driver-x64
          path: release_artifacts/

      - name: Create Zip Archive
        run: |
          cd release_artifacts
          zip -r ../viogpu-driver-x64.zip ./*

      - name: Determine Tag Name
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: viogpu-driver-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

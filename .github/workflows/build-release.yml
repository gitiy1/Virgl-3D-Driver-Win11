name: Build and Release Driver

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0-manual'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: my-viogpu

      - name: Install aria2
        run: choco install aria2 -y

      - name: Setup Enterprise WDK (EWDK)
        shell: powershell
        run: |
          # Use aria2 to drastically speed up the 20GB ISO download using multiple connections
          $ewdkUrl = "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/EWDK_ni_release_svc_prod1_22621_230929-1800.iso"
          
          Write-Host "Downloading EWDK ISO directly from $ewdkUrl using aria2c..."
          aria2c.exe -x 16 -s 16 -d "$env:GITHUB_WORKSPACE" -o ewdk.iso $ewdkUrl
          
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\ewdk.iso")) {
            throw "EWDK ISO download failed!"
          }
          
          $fileSize = (Get-Item "$env:GITHUB_WORKSPACE\ewdk.iso").length
          Write-Host "Downloaded EWDK ISO Size: $fileSize bytes"
          if ($fileSize -lt 1000000000) {
             throw "Downloaded file is too small ($fileSize bytes) to be an ISO!"
          }

          Write-Host "Mounting EWDK ISO..."
          $mountResult = Mount-DiskImage -ImagePath "$env:GITHUB_WORKSPACE\ewdk.iso" -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          Write-Host "Mounted EWDK on drive ${driveLetter}:"
          echo "EWDK_DRIVE=$driveLetter" >> $env:GITHUB_ENV

      - name: Clone kvm-guest-drivers-windows
        run: |
          git clone https://github.com/virtio-win/kvm-guest-drivers-windows.git

      - name: Merge user code into viogpu directory
        run: |
          # DO NOT delete the original viogpu folder! It contains the .sln and .vcxproj files.
          # Just overwrite the original viogpu contents with the user's modifications.
          Copy-Item -Recurse -Force my-viogpu\* kvm-guest-drivers-windows\viogpu\

      - name: Build VirtioLib (Win11 x64)
        run: |
          cd kvm-guest-drivers-windows\VirtIO
          cmd.exe /c "call ${{ env.EWDK_DRIVE }}:\BuildEnv\SetupBuildEnv.cmd && msbuild VirtioLib.vcxproj /p:Configuration=""Win11 Release"" /p:Platform=x64"

      - name: Build VirtIO-GPU Driver (Win11 x64)
        run: |
          cd kvm-guest-drivers-windows\viogpu
          cmd.exe /c "call ${{ env.EWDK_DRIVE }}:\BuildEnv\SetupBuildEnv.cmd && msbuild viogpu.sln /p:Configuration=""Win11 Release"" /p:Platform=x64"

      - name: Build VirtioLib (Win10 x64)
        run: |
          cd kvm-guest-drivers-windows\VirtIO
          cmd.exe /c "call ${{ env.EWDK_DRIVE }}:\BuildEnv\SetupBuildEnv.cmd && msbuild VirtioLib.vcxproj /p:Configuration=""Win10 Release"" /p:Platform=x64"

      - name: Build VirtIO-GPU Driver (Win10 x64)
        run: |
          cd kvm-guest-drivers-windows\viogpu
          cmd.exe /c "call ${{ env.EWDK_DRIVE }}:\BuildEnv\SetupBuildEnv.cmd && msbuild viogpu.sln /p:Configuration=""Win10 Release"" /p:Platform=x64"

      - name: Unmount EWDK
        if: always()
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\ewdk.iso") {
            Dismount-DiskImage -ImagePath "$env:GITHUB_WORKSPACE\ewdk.iso"
          }

      - name: Prepare Release Artifacts
        run: |
          mkdir release_artifacts
          mkdir release_artifacts\win11
          mkdir release_artifacts\win10
          
          Write-Host "Locating compiled artifacts..."
          
          # Find all essential Win11 files and flatten them into win11 folder
          $win11Items = Get-ChildItem -Path "kvm-guest-drivers-windows\viogpu" -Recurse -Include *.sys, *.inf, *.cat, *.exe, *.pdb | Where-Object { $_.FullName -match "win11" -or $_.FullName -match "Win11 Release" }
          if ($win11Items) {
            Write-Host "Copying Win11 binaries..."
            foreach ($item in $win11Items) { Copy-Item -Path $item.FullName -Destination "release_artifacts\win11\" -Force }
          } else {
            Write-Host "Warning: No Win11 binaries found."
            # Fallback direct copies in case paths don't explicitly contain 'Win11'
            if (Test-Path "kvm-guest-drivers-windows\viogpu\x64\Win11 Release") {
               Copy-Item -Path "kvm-guest-drivers-windows\viogpu\x64\Win11 Release\*" -Destination "release_artifacts\win11\" -Recurse -Force
            }
          }
          
          # Find all essential Win10 files and flatten them into win10 folder
          $win10Items = Get-ChildItem -Path "kvm-guest-drivers-windows\viogpu" -Recurse -Include *.sys, *.inf, *.cat, *.exe, *.pdb | Where-Object { $_.FullName -match "win10" -or $_.FullName -match "Win10 Release" }
          if ($win10Items) {
            Write-Host "Copying Win10 binaries..."
            foreach ($item in $win10Items) { Copy-Item -Path $item.FullName -Destination "release_artifacts\win10\" -Force }
          } else {
            Write-Host "Warning: No Win10 binaries found."
            if (Test-Path "kvm-guest-drivers-windows\viogpu\x64\Win10 Release") {
               Copy-Item -Path "kvm-guest-drivers-windows\viogpu\x64\Win10 Release\*" -Destination "release_artifacts\win10\" -Recurse -Force
            }
          }
          
          # Debug output to verify what was packaged
          Write-Host "Final packaged directory structure:"
          tree release_artifacts /F

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver-x64
          path: release_artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viogpu-driver-x64
          path: release_artifacts/

      - name: Create Zip Archive
        run: |
          cd release_artifacts
          zip -r ../viogpu-driver-x64.zip ./*

      - name: Determine Tag Name
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: viogpu-driver-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

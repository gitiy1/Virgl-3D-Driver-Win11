name: Build and Release Driver

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0-manual'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: my-viogpu

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Clone kvm-guest-drivers-windows
        run: |
          git clone https://github.com/virtio-win/kvm-guest-drivers-windows.git

      - name: Replace viogpu directory
        run: |
          Remove-Item -Recurse -Force kvm-guest-drivers-windows\viogpu
          Copy-Item -Recurse -Force my-viogpu kvm-guest-drivers-windows\viogpu

      - name: Cache WDK Installer
        id: cache-wdk
        uses: actions/cache@v4
        with:
          path: C:\wdk
          key: ${{ runner.os }}-wdk-22621-v2

      - name: Download WDK
        if: steps.cache-wdk.outputs.cache-hit != 'true'
        run: |
          mkdir C:\wdk
          # Direct download for Windows 11, version 22H2 WDK
          Invoke-WebRequest "https://download.microsoft.com/download/c/f/8/cf80b955-d578-4635-825c-2801911f9d79/wdk/wdksetup.exe" -OutFile "C:\wdk\wdksetup.exe"

      - name: Install WDK and VSIX
        run: |
          Write-Host "Installing WDK..."
          Start-Process -FilePath "C:\wdk\wdksetup.exe" -ArgumentList "/q" -Wait -NoNewWindow
          
          Write-Host "Locating WDK.vsix..."
          $vsixPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Vsix" -Filter "WDK.vsix" -Recurse | Select-Object -First 1
          
          if ($vsixPath) {
              Write-Host "Found VSIX at: $($vsixPath.FullName)"
              $vsixInstaller = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\VSIXInstaller.exe"
              Write-Host "Installing VSIX Extension into Visual Studio..."
              Start-Process -FilePath $vsixInstaller -ArgumentList "/q /admin `"$($vsixPath.FullName)`"" -Wait -NoNewWindow
              Write-Host "VSIX Installation completed."
          } else {
              Write-Host "Warning: WDK.vsix not found! WDK installation may be incomplete."
          }

      - name: Build VirtioLib (Win11 x64)
        run: |
          cd kvm-guest-drivers-windows\VirtIO
          msbuild VirtioLib.vcxproj /p:Configuration="Win11 Release" /p:Platform=x64

      - name: Build VirtIO-GPU Driver (Win11 x64)
        run: |
          cd kvm-guest-drivers-windows\viogpu
          msbuild viogpu.sln /p:Configuration="Win11 Release" /p:Platform=x64

      - name: Build VirtioLib (Win10 x64)
        run: |
          cd kvm-guest-drivers-windows\VirtIO
          msbuild VirtioLib.vcxproj /p:Configuration="Win10 Release" /p:Platform=x64

      - name: Build VirtIO-GPU Driver (Win10 x64)
        run: |
          cd kvm-guest-drivers-windows\viogpu
          msbuild viogpu.sln /p:Configuration="Win10 Release" /p:Platform=x64

      - name: Prepare Release Artifacts
        run: |
          mkdir release_artifacts
          
          # Win11
          if (Test-Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win11_amd64\amd64") {
            mkdir release_artifacts\win11
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win11_amd64\amd64\*" -Destination "release_artifacts\win11" -Recurse
          } elseif (Test-Path "kvm-guest-drivers-windows\viogpu\x64\Win11 Release") {
            mkdir release_artifacts\win11
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\x64\Win11 Release\*" -Destination "release_artifacts\win11" -Recurse
          }
          
          # Win10
          if (Test-Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win10_amd64\amd64") {
            mkdir release_artifacts\win10
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\viogpudo\objfre_win10_amd64\amd64\*" -Destination "release_artifacts\win10" -Recurse
          } elseif (Test-Path "kvm-guest-drivers-windows\viogpu\x64\Win10 Release") {
            mkdir release_artifacts\win10
            Copy-Item -Path "kvm-guest-drivers-windows\viogpu\x64\Win10 Release\*" -Destination "release_artifacts\win10" -Recurse
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver-x64
          path: release_artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: viogpu-driver-x64
          path: release_artifacts/

      - name: Create Zip Archive
        run: |
          cd release_artifacts
          zip -r ../viogpu-driver-x64.zip ./*

      - name: Determine Tag Name
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: viogpu-driver-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
